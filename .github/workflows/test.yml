name: "Build and test"

on:
  push:
    branches:
      - master
  pull_request:

env:
  PRODUCTION: true
  ENV_KEY_PROJECT_NAME: dot-env

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install
      - name: Check formatting and lint
        run: pnpm run format && pnpm run check
      - name: Run build and package command
        run: pnpm run build && pnpm run package
      - name: Verify is there is no diff
        run: |
          if [[ -n $(git diff --exit-code) ]]
          then
            echo "Please run pnpm run build && pnpm run package to update dist folder"
            exit 1
          fi

  test:
    name: Test env file
    needs: build
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        mode: [overwrite, append]
    runs-on: ${{ matrix.os }}
    env:
      ENV_KEY_DEBUG: true
      ENV_KEY_USERNAME: root
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: enable corepack
        run: |
          corepack enable
      - name: write initial content to .env
        if: ${{ matrix.mode == 'append' }}
        shell: bash
        run: |
          echo "OUTPUT_USERNAME=root" >> tests/development.env
          printf 'OUTPUT_SEEDED=initial_value' >> tests/development.env
      - id: test-action
        uses: ./
        with:
          input-prefix: "ENV_KEY_"
          file-path: "tests/development.env"
          output-prefix: "OUTPUT_"
          write-mode: ${{ matrix.mode }}
        env:
          IS_SERVER: false
          ENV_KEY_USERNAME: admin
          ENV_KEY_API_KEY: USER_API_KEY
          ENV_KEY_SECRET_KEY: secret123
          ENV_KEY_ENV_KEY_MULTIPLE: test
          SOME_ENV_KEY: no_value
          ENV_KEY_WITH_QUOTE: "quote_value"
          ENV_KEY_WITH_START_QUOTE: '"quote'
          ENV_KEY_WITH_NON_START_QUOTE: quote"_value"
          ENV_KEY_FULLY_QUOTED: '"hello"'
          ENV_KEY_WITH_HASH: 'pass#word'
          ENV_KEY_WITH_SPACES: '  padded  '
          ENV_KEY_WITH_SINGLE_QUOTE: "it's a value"
          ENV_KEY_WITH_BOTH_QUOTES: "it's \"quoted\""
          ENV_KEY_WITH_BACKTICK: 'back`tick'
          ENV_KEY_WITH_EQUALS: 'a=b=c'
          ENV_KEY_JSON: '{"key": "value"}'
          ENV_KEY_WINDOWS_PATH: 'C:\Users\test\bin'
          ENV_KEY_URL: 'https://user:pass@example.com/path?a=1&b=2'
          ENV_KEY_EMPTY: ''
          ENV_KEY_MULTILINE: |
            some multiline
            string here
      - name: Cat generated dot env file
        run: |
          cat tests/development.env
      - name: Install pnpm dependencies
        run: pnpm install
      - name: Run test
        env:
          WRITE_MODE: ${{ matrix.mode }}
        run: pnpm run test
